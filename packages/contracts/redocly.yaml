# Structural rules stay on (recommended). Style-only rules are off:
# - operation-summary: operationId + path are descriptive enough for an internal API
# - operation-4xx-response: every operation uses `default: Problem` (RFC 9457) instead of listing each 4xx
extends:
  - recommended
rules:
  operation-summary: off
  operation-4xx-response: off
  tag-description: off
  info-license: off
