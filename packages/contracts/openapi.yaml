openapi: 3.1.0
info:
  title: ServiceFlow AI — Customer API
  version: 0.1.0-draft
  summary: Contract between apps/web and services/api (plan §7). DRAFT — written by the frontend from the designs; backend reviews before implementing.
  description: |
    Conventions (plan §7.2):
    - Base path /api/v1, same-origin with the web app (Caddy routes /api → services/api).
    - JSON, camelCase fields, ISO-8601 UTC timestamps, UUID ids.
    - Cursor pagination: ?limit=50&cursor=… → { data: [...], nextCursor }. limit max 100.
    - Errors are RFC 9457 Problem Details (application/problem+json).
    - POST that creates data accepts Idempotency-Key. Updates of versioned resources require If-Match (ETag = version).
    - Every mutating request sends X-CSRF-Token (double-submit) — added by the client middleware.
    Items marked `x-draft-note` are frontend assumptions that the backend must confirm.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: me
  - name: tickets
  - name: field
    description: Technician (Agent) actions on mobile — plan §21.5
  - name: assets
  - name: imports
  - name: knowledge
  - name: ai
  - name: line
  - name: categories
  - name: team
  - name: security
  - name: support-access
  - name: reports
  - name: billing
  - name: audit

paths:
  # ───────────────────────── auth / me ─────────────────────────
  /auth/{provider}/start:
    get:
      tags: [auth]
      operationId: authStart
      summary: Start OIDC sign-in (browser navigation, not fetch)
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthProvider'
        - name: tenant
          in: query
          description: Tenant slug the user is signing in to (shown on the sign-in page).
          schema: { type: string }
        - name: returnTo
          in: query
          description: Relative path to return to after sign-in. Server must only accept same-origin relative paths.
          schema: { type: string }
      responses:
        '302': { description: Redirect to the identity provider }
        default: { $ref: '#/components/responses/Problem' }
  /auth/{provider}/callback:
    get:
      tags: [auth]
      operationId: authCallback
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthProvider'
      responses:
        '302': { description: Session created; redirect to returnTo or the role's home page }
        default: { $ref: '#/components/responses/Problem' }
  /workspaces/{slug}/public:
    get:
      tags: [auth]
      operationId: getWorkspacePublic
      summary: Public name of a workspace for the sign-in page ("พื้นที่ทำงาน")
      x-draft-note: Not in plan table 17; the SignIn design shows the company name before login. Must be rate-limited and return 404 for unknown slugs (tenant enumeration risk) — backend to confirm.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,40}$' }
      responses:
        '200':
          description: Public workspace info
          content:
            application/json:
              schema:
                type: object
                required: [slug, displayName]
                properties:
                  slug: { type: string }
                  displayName: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      parameters:
        - name: all
          in: query
          description: Sign out from every device.
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Signed out }
        default: { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [me]
      operationId: getMe
      responses:
        '200':
          description: Current user, memberships and active tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Problem' }
  /me/active-tenant:
    post:
      tags: [me]
      operationId: setActiveTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId]
              properties:
                tenantId: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Active tenant switched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Problem' }
  /me/availability:
    put:
      tags: [field]
      operationId: setMyAvailability
      summary: Technician "พร้อมรับงานใหม่" switch
      x-draft-note: Not in plan table 17; required by the TechJobs design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available: { type: boolean }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────── tickets ─────────────────────────
  /tickets:
    get:
      tags: [tickets]
      operationId: listTickets
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: view
          in: query
          description: Saved views on the Tickets page tabs.
          schema: { type: string, enum: [open, unassigned, sla_breached, waiting, closed] }
        - name: status
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/TicketStatus' } }
        - name: priority
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/TicketPriority' } }
        - name: categoryId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: assignee
          in: query
          description: A user id, "me", or "none" for unassigned.
          schema: { type: string }
        - name: area
          in: query
          description: Branch / area filter (สาขา / พื้นที่).
          schema: { type: string }
        - name: assetId
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: sla
          in: query
          schema: { type: string, enum: [breached, at_risk] }
        - name: q
          in: query
          description: Search ticket number, asset code or customer name.
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          schema:
            {
              type: string,
              enum: [createdAt, -createdAt, slaDueAt, -slaDueAt, priority, -priority],
              default: -createdAt,
            }
      responses:
        '200':
          description: Page of tickets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/TicketSummary' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [tickets]
      operationId: createTicket
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTicketRequest' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/counts:
    get:
      tags: [tickets]
      operationId: getTicketCounts
      x-draft-note: Not in plan table 17; the Tickets page tabs and the sidebar badge show these counts.
      responses:
        '200':
          description: Counts per saved view (same filters as GET /tickets?view=…)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketCounts' }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/export:
    get:
      tags: [tickets]
      operationId: exportTickets
      summary: Export the current filter as CSV
      x-draft-note: Not in plan table 17; required by the Tickets design ("ส่งออก CSV").
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [open, unassigned, sla_breached, waiting, closed] }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/bulk-assign:
    post:
      tags: [tickets]
      operationId: bulkAssignTickets
      x-draft-note: Not in plan table 17; required by the BulkActionBar on the Tickets design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticketIds, assigneeId]
              properties:
                ticketIds:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 100,
                    items: { $ref: '#/components/schemas/Uuid' },
                  }
                assigneeId: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Per-ticket result
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [ticketId, ok]
                      properties:
                        ticketId: { $ref: '#/components/schemas/Uuid' }
                        ok: { type: boolean }
                        problem: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [tickets]
      operationId: getTicket
      responses:
        '200':
          description: Ticket detail
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [tickets]
      operationId: updateTicket
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTicketRequest' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/{id}/transitions:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tickets]
      operationId: transitionTicket
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        '200':
          description: Transitioned
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tickets]
      operationId: assignTicket
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeId]
              properties:
                assigneeId: { $ref: '#/components/schemas/Uuid' }
                notify: { type: boolean, default: true, description: Notify the technician on LINE }
      responses:
        '200':
          description: Assigned
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/{id}/assignee-suggestions:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [tickets]
      operationId: listAssigneeSuggestions
      x-draft-note: Not in plan table 17; the TicketDetail design shows "ใกล้สุด · มีงานที่เครื่องนี้" and open-job counts per technician.
      responses:
        '200':
          description: Technicians ranked for this ticket
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AssigneeSuggestion' } }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/{id}/events:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [tickets]
      operationId: listTicketEvents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Timeline (oldest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/TicketEvent' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [tickets]
      operationId: addTicketNote
      summary: Add an internal note (customer never sees it)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: Note added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketEvent' }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tickets]
      operationId: createTicketAttachment
      summary: Get a presigned upload URL (photos are resized and EXIF/GPS stripped on the client first)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '201':
          description: Upload target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadTarget' }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tickets]
      operationId: sendTicketMessage
      summary: Reply to the customer on LINE (via outbox)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                suggestionId:
                  description: Set when the agent used an AI suggestion (for quality metrics).
                  $ref: '#/components/schemas/Uuid'
      responses:
        '202':
          description: Queued for delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketEvent' }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/{id}/reply-suggestions:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tickets, ai]
      operationId: createReplySuggestions
      summary: AI drafts a reply from the knowledge base (never sends by itself)
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AiSuggestion' } }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/{id}/claim:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [field]
      operationId: claimTicket
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Claimed by the current technician
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/{id}/release:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [field]
      operationId: releaseTicket
      summary: Technician declines / hands the job back with a reason
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        default: { $ref: '#/components/responses/Problem' }
  /tickets/{id}/checklist:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [field]
      operationId: getTicketChecklist
      responses:
        '200':
          description: Checklist generated from the knowledge base
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checklist' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [field]
      operationId: updateTicketChecklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [id, done]
                    properties:
                      id: { $ref: '#/components/schemas/Uuid' }
                      done: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checklist' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────── assets / imports ─────────────────────────
  /assets:
    get:
      tags: [assets]
      operationId: listAssets
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: branch
          in: query
          schema: { type: string }
        - name: condition
          in: query
          schema: { $ref: '#/components/schemas/AssetCondition' }
      responses:
        '200':
          description: Page of assets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Asset' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [assets]
      operationId: createAsset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        default: { $ref: '#/components/responses/Problem' }
  /assets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [assets]
      operationId: getAsset
      responses:
        '200':
          description: Asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [assets]
      operationId: updateAsset
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [assets]
      operationId: deactivateAsset
      responses:
        '204': { description: Deactivated }
        default: { $ref: '#/components/responses/Problem' }
  /assets/qr-sheet:
    post:
      tags: [assets]
      operationId: createAssetQrSheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetIds]
              properties:
                assetIds:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 500,
                    items: { $ref: '#/components/schemas/Uuid' },
                  }
      responses:
        '200':
          description: PDF ready to download (short-lived URL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadLink' }
        default: { $ref: '#/components/responses/Problem' }
  /imports:
    post:
      tags: [imports]
      operationId: createImport
      summary: Step 1 — create an import job and get the upload URL for the CSV/XLSX file
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, enum: [assets] }
                file: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '202':
          description: Job created
          content:
            application/json:
              schema:
                type: object
                required: [job, upload]
                properties:
                  job: { $ref: '#/components/schemas/ImportJob' }
                  upload: { $ref: '#/components/schemas/UploadTarget' }
        default: { $ref: '#/components/responses/Problem' }
  /imports/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [imports]
      operationId: getImport
      responses:
        '200':
          description: Job status, detected columns and validation summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        default: { $ref: '#/components/responses/Problem' }
  /imports/{id}/mapping:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [imports]
      operationId: setImportMapping
      summary: Step 2 — map file columns to asset fields, triggers validation (step 3)
      x-draft-note: Not in plan table 17; required by the 4-step import wizard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mapping]
              properties:
                mapping:
                  type: object
                  description: File column header → target field ("skip" = do not import).
                  additionalProperties:
                    type: string
                    enum: [code, location, model, installedAt, note, skip]
      responses:
        '202':
          description: Validating
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        default: { $ref: '#/components/responses/Problem' }
  /imports/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [imports]
      operationId: confirmImport
      summary: Step 4 — import valid rows in one transaction
      x-draft-note: Not in plan table 17; required by the 4-step import wizard.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Importing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        default: { $ref: '#/components/responses/Problem' }
  /imports/{id}/errors:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [imports]
      operationId: listImportErrors
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Rows that failed validation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    required: [data]
                    properties:
