components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sf_session
      description: HttpOnly server-side session (plan §8.2). Mutations also require the X-CSRF-Token header.

  headers:
    ETag:
      description: Resource version, send back in If-Match.
      schema: { type: string }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AuthProvider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [line, google] }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    Range:
      name: range
      in: query
      schema: { type: string, enum: [today, 7d, 30d, quarter, custom], default: 30d }
    From:
      name: from
      in: query
      description: Required when range=custom (date, Asia/Bangkok).
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      schema: { type: string, format: date }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Uuid: { type: string, format: uuid }
    Timestamp: { type: string, format: date-time }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    CursorPage:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { type: [string, 'null'] }

    UserRef:
      type: object
      required: [id, displayName]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }

    TenantRole:
      type: string
      enum: [owner, admin, agent, viewer]

    Membership:
      type: object
      required: [tenantId, tenantSlug, tenantName, role]
      properties:
        tenantId: { $ref: '#/components/schemas/Uuid' }
        tenantSlug: { type: string }
        tenantName: { type: string }
        planName: { type: string }
        role: { $ref: '#/components/schemas/TenantRole' }

    Me:
      type: object
      required: [user, memberships, activeTenantId, sampleData]
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/UserRef'
            - type: object
              properties:
                email: { type: [string, 'null'], format: email }
                available: { type: boolean, description: Technician availability switch }
        memberships: { type: array, items: { $ref: '#/components/schemas/Membership' } }
        activeTenantId: { type: [string, 'null'], format: uuid }
        sampleData:
          type: boolean
          description: True for demo tenants seeded with sample data — UI shows the "ข้อมูลตัวอย่าง" chip.

    # ── tickets ──
    TicketStatus:
      type: string
      enum: [new, assigned, in_progress, waiting, resolved]
    WaitingReason:
      type: string
      enum: [customer, parts]
    TicketPriority:
      type: string
      enum: [urgent, high, normal, low]
    TicketSource:
      type: string
      enum: [line, web]

    Sla:
      type: object
      required: [dueAt, pausedAt, state]
      properties:
        dueAt: { type: [string, 'null'], format: date-time }
        pausedAt:
          type: [string, 'null']
          format: date-time
          description: Set while waiting for the customer or for parts (SLA clock stopped).
        state: { type: string, enum: [on_track, at_risk, breached, paused, met, missed] }

    CategoryRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }

    AssetRef:
      type: object
      required: [id, code, branch]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, examples: [VM-BKK-0231] }
        branch: { type: string, examples: [สาขาสยาม] }
        locationDetail: { type: [string, 'null'], examples: [ชั้น 2] }

    TicketSummary:
      type: object
      required:
        [
          id,
          number,
          title,
          status,
          waitingReason,
          priority,
          category,
          asset,
          assignee,
          source,
          sla,
          createdAt,
          updatedAt,
          version,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: string, examples: [SF-000148] }
        title: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        waitingReason:
          oneOf:
            - $ref: '#/components/schemas/WaitingReason'
            - type: 'null'
        priority: { $ref: '#/components/schemas/TicketPriority' }
        category:
          oneOf:
            - $ref: '#/components/schemas/CategoryRef'
            - type: 'null'
        asset:
          oneOf:
            - $ref: '#/components/schemas/AssetRef'
            - type: 'null'
        assignee:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        customerName: { type: [string, 'null'] }
        source: { $ref: '#/components/schemas/TicketSource' }
        sla: { $ref: '#/components/schemas/Sla' }
        aiSummary: { type: [string, 'null'], description: One-line AI summary for technicians }
        distanceKm:
          { type: [number, 'null'], description: Distance from the technician (field views only) }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        version: { type: integer }

    Ticket:
      allOf:
        - $ref: '#/components/schemas/TicketSummary'
        - type: object
          required: [description, acceptedAt, resolvedAt, requirePhotoOnResolve]
          properties:
            description: { type: [string, 'null'] }
            customer:
              type: [object, 'null']
              properties:
                displayName: { type: string }
                phoneMasked: { type: [string, 'null'] }
            acceptedAt: { type: [string, 'null'], format: date-time }
            resolvedAt: { type: [string, 'null'], format: date-time }
            requirePhotoOnResolve: { type: boolean }
            assetLocation:
              type: [object, 'null']
              properties:
                lat: { type: number }
                lng: { type: number }
            relatedOpenTickets:
              type: array
              description: Other open tickets on the same asset
              items: { $ref: '#/components/schemas/TicketRef' }

    TicketCounts:
      type: object
      required: [open, unassigned, slaBreached, waiting, closed, receivedThisMonth]
      properties:
        open: { type: integer }
        unassigned: { type: integer }
        slaBreached: { type: integer }
        waiting: { type: integer }
        closed: { type: integer }
        receivedThisMonth: { type: integer }

    TicketRef:
      type: object
      required: [id, number, title, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }

    CreateTicketRequest:
      type: object
      required: [title, categoryId]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        categoryId: { $ref: '#/components/schemas/Uuid' }
        assetCode: { type: string, maxLength: 64 }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        assigneeId: { $ref: '#/components/schemas/Uuid' }

    UpdateTicketRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        categoryId: { $ref: '#/components/schemas/Uuid' }

    TransitionRequest:
      type: object
      required: [to]
      properties:
        to: { $ref: '#/components/schemas/TicketStatus' }
        waitingReason: { $ref: '#/components/schemas/WaitingReason' }
        note: { type: string, maxLength: 2000 }
        notifyCustomer:
          { type: boolean, default: false, description: Send the resolve message on LINE }
        partsUsed:
          type: array
          items: { type: string, maxLength: 100 }

    TicketEventType:
      type: string
      enum: [message_in, message_out, ai_reply, note, status_change, assignment, system]

    TicketEvent:
      type: object
      required: [id, type, actorType, actor, body, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/TicketEventType' }
        actorType: { type: string, enum: [customer, user, ai, system] }
        actor:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        body: { type: [string, 'null'] }
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/TicketStatus'
            - type: 'null'
        toStatus:
          oneOf:
            - $ref: '#/components/schemas/TicketStatus'
            - type: 'null'
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        sources:
          type: array
          description: Knowledge sources for ai_reply events
          items: { $ref: '#/components/schemas/KnowledgeSource' }
        deliveryStatus: { type: [string, 'null'], enum: [queued, sent, failed, null] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    Attachment:
      type: object
      required: [id, mime, url]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mime: { type: string }
        url: { type: string, format: uri, description: Short-lived signed URL }
        thumbnailUrl: { type: [string, 'null'], format: uri }

    AssigneeSuggestion:
      type: object
      required: [user, openTickets, reason]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        openTickets: { type: integer }
        reason: { type: [string, 'null'], examples: [ใกล้สุด · มีงานที่เครื่องนี้] }

    AiSuggestion:
      type: object
      required: [id, body, confidence, sources]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        body: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        sources: { type: array, items: { $ref: '#/components/schemas/KnowledgeSource' } }

    Checklist:
      type: object
      required: [items, sourceDocument]
      properties:
        sourceDocument:
          oneOf:
            - $ref: '#/components/schemas/KnowledgeSource'
            - type: 'null'
        items:
          type: array
          items:
            type: object
            required: [id, label, done]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              label: { type: string }
              done: { type: boolean }

    # ── uploads ──
    UploadRequest:
      type: object
      required: [fileName, mime, size, sha256]
      properties:
        fileName: { type: string, maxLength: 255 }
        mime: { type: string }
        size: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    UploadTarget:
      type: object
      required: [uploadUrl, method, headers, expiresAt, objectKey]
      properties:
        uploadUrl: { type: string, format: uri }
        method: { type: string, enum: [PUT] }
        headers: { type: object, additionalProperties: { type: string } }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        objectKey: { type: string }
    DownloadLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }

    # ── assets ──
    AssetCondition:
      type: string
      enum: [operational, open_tickets, out_of_service]
      x-draft-note: From the Assets filter "ใช้งานได้ / มีงานเปิด / ปิดซ่อม".
    Asset:
      type: object
      required: [id, code, branch, model, condition, openTickets, tickets30d, installedAt, active]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        branch: { type: string }
        locationDetail: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        condition: { $ref: '#/components/schemas/AssetCondition' }
        openTickets: { type: integer }
        tickets30d: { type: integer }
        installedAt: { type: [string, 'null'], format: date }
        note: { type: [string, 'null'] }
        active: { type: boolean }
        location:
          type: [object, 'null']
          properties:
            lat: { type: number }
            lng: { type: number }
    AssetInput:
      type: object
      required: [code, branch]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        branch: { type: string, minLength: 1, maxLength: 100 }
        locationDetail: { type: string, maxLength: 200 }
        model: { type: string, maxLength: 100 }
        installedAt: { type: string, format: date }
        note: { type: string, maxLength: 500 }

    ImportJob:
      type: object
      required: [id, kind, status, totalRows, validRows, errorRows, columns, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [assets] }
        status:
          {
            type: string,
            enum: [awaiting_upload, mapping, validating, ready, importing, completed, failed],
          }
        fileName: { type: [string, 'null'] }
        columns:
          type: array
          description: Column headers detected in the file, with a suggested mapping
          items:
            type: object
            required: [header, suggested]
            properties:
              header: { type: string }
              suggested: { type: string, enum: [code, location, model, installedAt, note, skip] }
        totalRows: { type: integer }
        validRows: { type: integer }
        errorRows: { type: integer }
        duplicateRows: { type: integer }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    ImportRowError:
      type: object
      required: [rowNo, field, message]
      properties:
        rowNo: { type: integer }
        field: { type: string }
        message: { type: string }

    # ── knowledge / ai ──
    KnowledgeSource:
      type: object
      required: [documentId, title]
      properties:
        documentId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        excerpt: { type: [string, 'null'] }
    KnowledgeDocument:
      type: object
      required: [id, kind, title, category, status, audience, timesUsed, helpfulRate, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [faq, manual] }
        title: { type: string }
        category: { type: [string, 'null'] }
        status: { type: string, enum: [published, draft, processing, failed] }
        audience: { type: string, enum: [customers, internal], description: ใครเห็น }
        timesUsed: { type: integer }
        helpfulRate: { type: [number, 'null'], minimum: 0, maximum: 1 }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    CreateKnowledgeDocumentRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateFaqRequest'
        - $ref: '#/components/schemas/CreateManualRequest'
      discriminator:
        propertyName: kind
        mapping:
          faq: '#/components/schemas/CreateFaqRequest'
          manual: '#/components/schemas/CreateManualRequest'
    CreateFaqRequest:
      type: object
      required: [kind, question, answer]
      properties:
        kind: { type: string, const: faq }
        question: { type: string, minLength: 1, maxLength: 500 }
        answer: { type: string, minLength: 1, maxLength: 4000 }
        category: { type: string }
        audience: { type: string, enum: [customers, internal], default: customers }
        fromGapId: { $ref: '#/components/schemas/Uuid' }
    CreateManualRequest:
      type: object
      required: [kind, title, file]
      properties:
        kind: { type: string, const: manual }
        title: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string }
        audience: { type: string, enum: [customers, internal], default: internal }
        file: { $ref: '#/components/schemas/UploadRequest' }
    KnowledgeAnswer:
      type: object
      required: [grounded, answer, confidence, sources]
      properties:
        grounded: { type: boolean, description: False = AI refused (no evidence) }
        answer: { type: [string, 'null'] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        sources: { type: array, items: { $ref: '#/components/schemas/KnowledgeSource' } }
    KnowledgeGap:
      type: object
      required: [id, question, count, lastAskedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        question: { type: string }
        count: { type: integer }
        lastAskedAt: { $ref: '#/components/schemas/Timestamp' }
    AiSettings:
      type: object
      required: [autoAnswerMinConfidence, escalateWhenUnsure, forbidMonetaryPromises]
      properties:
        autoAnswerMinConfidence: { type: number, enum: [0.7, 0.8, 0.9] }
        escalateWhenUnsure: { type: boolean }
        forbidMonetaryPromises:
          { type: boolean, description: ห้าม AI รับปากเรื่องคืนเงินหรือส่วนลด }

    # ── LINE ──
    LineChannel:
      type: object
      required:
        [
          status,
          channelId,
          lineId,
          channelSecretMasked,
          accessTokenMasked,
          webhookUrl,
          lastVerifiedAt,
        ]
      properties:
        status: { type: string, enum: [connected, error, not_connected] }
        channelId: { type: [string, 'null'] }
        lineId: { type: [string, 'null'], examples: ['@smartvend-help'] }
        channelSecretMasked: { type: [string, 'null'] }
        accessTokenMasked: { type: [string, 'null'] }
        webhookUrl: { type: string, format: uri }
        lastVerifiedAt: { type: [string, 'null'], format: date-time }
        lastMessageAt: { type: [string, 'null'], format: date-time }
        messagesToday: { type: integer }
        ticketsOpenedToday: { type: integer }
        lastError: { type: [string, 'null'] }
    LineChannelInput:
      type: object
      required: [channelId]
      properties:
        channelId: { type: string }
        channelSecret: { type: string, writeOnly: true, description: Only sent when rotating }
        accessToken: { type: string, writeOnly: true, description: Only sent when rotating }
    LineVerifyResult:
      type: object
      required: [ok, checkedAt]
      properties:
        ok: { type: boolean }
        checkedAt: { $ref: '#/components/schemas/Timestamp' }
        errorCode: { type: [string, 'null'] }
    LineSettings:
      type: object
      required: [welcomeMessage, businessHours, afterHoursAi, menuItems]
      properties:
        welcomeMessage: { type: string, maxLength: 1000 }
        businessHours:
          type: object
          required: [start, end]
          properties:
            start: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
            end: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        afterHoursAi: { type: boolean }
        menuItems:
          type: array
          maxItems: 6
          items:
            type: object
            required: [label, action]
            properties:
              label: { type: string, maxLength: 20 }
              action: { type: string, enum: [report_problem, check_status, faq, contact_staff] }

    ProblemCategory:
      allOf:
        - $ref: '#/components/schemas/ProblemCategoryInput'
        - type: object
          required: [id]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
    ProblemCategoryInput:
      type: object
      required:
        [
          name,
          keywords,
          defaultPriority,
          ackSlaMinutes,
          resolveSlaMinutes,
          requiredFields,
          requirePhotoOnResolve,
        ]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        keywords: { type: array, items: { type: string, maxLength: 50 }, maxItems: 30 }
        defaultPriority: { $ref: '#/components/schemas/TicketPriority' }
        ackSlaMinutes: { type: integer, minimum: 1 }
        resolveSlaMinutes: { type: integer, minimum: 1 }
        requiredFields:
          type: array
          description: What the bot must ask the customer
          items: { type: string, enum: [asset_code, photo, amount, phone, description] }
        requirePhotoOnResolve: { type: boolean }

    # ── team / security ──
    Member:
      type: object
      required: [user, role, area, openTickets, lastActiveAt]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        role: { $ref: '#/components/schemas/TenantRole' }
        area: { type: [string, 'null'] }
        openTickets: { type: integer }
        loginProvider: { type: string, enum: [line, google] }
        lastActiveAt: { type: [string, 'null'], format: date-time }
    Invitation:
      type: object
      required: [id, role, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: [string, 'null'], format: email }
        role: { $ref: '#/components/schemas/TenantRole' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        link: { type: [string, 'null'], format: uri, description: Returned once on creation }
    TenantSecurity:
      type: object
      required: [idleTimeoutMinutes, loginProviders, autoApproveReadOnlySupport]
      properties:
        idleTimeoutMinutes: { type: integer, enum: [60, 480, 720] }
        loginProviders:
          type: object
          required: [line, google]
          properties:
            line: { type: boolean }
            google: { type: boolean }
        autoApproveReadOnlySupport: { type: boolean, default: false }

    SupportAccessScope:
      type: string
      enum: [line.read, line.write, tickets.read, tickets.read_media, knowledge.read]
    SupportAccessStatus:
      type: string
      enum: [pending, active, denied, expired, revoked]
    SupportAccessRequest:
      type: object
      required: [id, requestedBy, reason, scopes, durationMinutes, status, requestedAt, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        requestedBy: { type: string, description: ServiceFlow staff display name }
        reason: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/SupportAccessScope' } }
        durationMinutes: { type: integer, enum: [30, 60, 120] }
        status: { $ref: '#/components/schemas/SupportAccessStatus' }
        breakGlass: { type: boolean, default: false }
        requestedAt: { $ref: '#/components/schemas/Timestamp' }
        expiresAt: { type: [string, 'null'], format: date-time }

    # ── reports / billing / audit ──
    ReportSummary:
      type: object
      required: [kpis, openByStatus, daily, topProblems, recentActivity]
      properties:
        kpis:
          type: object
          required: [newUnassigned, inProgress, waiting, resolvedToday, resolvedWithinSla]
          properties:
            newUnassigned: { type: integer }
            newBySource: { type: object, additionalProperties: { type: integer } }
            inProgress: { type: integer }
            assigned: { type: integer }
            waiting: { type: integer }
            waitingCustomer: { type: integer }
            waitingParts: { type: integer }
            resolvedToday: { type: integer }
            resolvedWithinSla: { type: integer }
            totalTickets: { type: integer }
            firstResponseMinutesP50: { type: [number, 'null'] }
            resolutionMinutesP50: { type: [number, 'null'] }
            slaMetRate: { type: [number, 'null'] }
            csatAverage: { type: [number, 'null'] }
        openByStatus:
          type: object
          additionalProperties: { type: integer }
        daily:
          type: array
          items:
            type: object
            required: [date, total]
            properties:
              date: { type: string, format: date }
              total: { type: integer }
              aiResolved: { type: integer }
        topProblems:
          type: array
          items:
            type: object
            required: [categoryName, share]
            properties:
              categoryName: { type: string }
              share: { type: number, minimum: 0, maximum: 1 }
        slaBreached:
          type: array
          items: { $ref: '#/components/schemas/TicketRef' }
        recentActivity:
          type: array
          items:
            type: object
            required: [at, text]
            properties:
              at: { $ref: '#/components/schemas/Timestamp' }
              text: { type: string }
              ticket:
                oneOf:
                  - $ref: '#/components/schemas/TicketRef'
                  - type: 'null'
    SlaByCategory:
      type: object
      required: [categoryName, tickets, metRate, targetMinutes]
      properties:
        categoryName: { type: string }
        tickets: { type: integer }
        metRate: { type: number }
        targetMinutes: { type: integer }
    TechnicianPerformance:
      type: object
      required: [user, resolved, avgResolutionMinutes, slaMetRate]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        resolved: { type: integer }
        avgResolutionMinutes: { type: [number, 'null'] }
        slaMetRate: { type: [number, 'null'] }
        csatAverage: { type: [number, 'null'] }
    AssetProblemStat:
      type: object
      required: [asset, tickets, topProblem]
      properties:
        asset: { $ref: '#/components/schemas/AssetRef' }
        tickets: { type: integer }
        topProblem: { type: [string, 'null'] }
    UsageMeter:
      type: object
      required: [used, limit]
      properties:
        used: { type: integer }
        limit: { type: [integer, 'null'], description: null = unlimited }
    Usage:
      type: object
      required: [periodStart, periodEnd, aiAnswers, tickets, assets, members]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        aiAnswers:
          allOf:
            - $ref: '#/components/schemas/UsageMeter'
            - type: object
              properties:
                selfResolvedRate: { type: [number, 'null'] }
        tickets: { $ref: '#/components/schemas/UsageMeter' }
        assets: { $ref: '#/components/schemas/UsageMeter' }
        members: { $ref: '#/components/schemas/UsageMeter' }
    Subscription:
      type: object
      required: [planName, status, renewsAt]
      properties:
        planName: { type: string }
        status: { type: string, enum: [trial, active, past_due, suspended] }
        renewsAt: { type: [string, 'null'], format: date }
        trialEndsAt: { type: [string, 'null'], format: date }
    AuditLogEntry:
      type: object
      required: [id, actor, action, target, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        actor:
          type: object
          required: [type, displayName]
          properties:
            type: { type: string, enum: [user, platform, system] }
            displayName: { type: string }
        action: { type: string }
        target: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        grantId: { type: [string, 'null'], format: uuid }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
